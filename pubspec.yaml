name: qr_basedregistrationapp
description: "AuthentiCheck - QR Based Product Registration App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.6

  # QR Scanner
  mobile_scanner: ^5.2.3

  # UI & Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/